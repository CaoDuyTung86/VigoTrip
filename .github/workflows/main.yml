name: Ticket Booking CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 0. Security - Quét rò rỉ bí mật (Secret Detection)
  gitleaks:
    name: 🔐 Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Cần toàn bộ lịch sử Git để quét

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 1. Build & Test Backend
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build Backend with Maven
      run: |
        cd backend/ticket-booking
        mvn clean package -DskipTests

    # Cong chat luong truy hoi RAG. Chay offline hoan toan: JUnit thuan, khong can
    # Spring context, khong can DB, khong can API key -- chi do nhanh BM25 tren bo
    # 57 cau hoi vang. Test tu fail neu recall@3 < 0.85 hoac MRR < 0.70, nen sua
    # knowledge base hay TextNormalizer ma lam tut chat luong thi build do ngay.
    - name: RAG Retrieval Quality Gate
      run: |
        cd backend/ticket-booking
        mvn test -Dtest=RagRetrievalQualityTest -DfailIfNoTests=false

  # 2. Build & Test Frontend
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: my-react-app/package-lock.json
        
    - name: Install dependencies & Build Frontend
      run: |
        cd my-react-app
        npm install
        npm run build

    # Chặn "dịch sót": khoá gọi trong code mà bảng dịch không có, bảng en thiếu khoá so
    # với vi, hoặc chuỗi tiếng Việt viết cứng mới phát sinh. Nợ cũ đã đóng băng trong
    # scripts/i18n-baseline.json nên bước này chỉ đỏ khi có người thêm chỗ sót MỚI.
    - name: Check i18n
      run: |
        cd my-react-app
        npm run i18n:check

    # Test đơn vị frontend (Vitest). Chạy sau build để lỗi build lộ ra trước,
    # nhưng vẫn chặn được job nếu logic vé/ghế/đếm ngược bị sửa hỏng.
    - name: Run Frontend Unit Tests
      run: |
        cd my-react-app
        npm run test:run

  # 3. Docker Build Test (Ensures Dockerfiles are correct)
  docker-test:
    needs: [build-backend, build-frontend, gitleaks]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Test Docker Compose Build
      run: docker compose build
