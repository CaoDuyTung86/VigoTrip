name: Ticket Booking CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 0. Security - Quét rò rỉ bí mật (Secret Detection)
  gitleaks:
    name: 🔐 Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Cần toàn bộ lịch sử Git để quét

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 1. Build & Test Backend
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    # Chay DU bo test backend, khong con -DskipTests. Truoc day buoc nay bo qua toan
    # bo test roi chi goi rieng RagRetrievalQualityTest, nen 47 lop test con lai chua
    # bao gio chay tren CI -- luoi an toan co san ma khong duoc mac. Ca bo chay offline
    # hoan toan: H2 trong bo nho, profile "test", khong can DB that lan API key.
    #
    # Cong chat luong truy hoi RAG nam trong bo nay chu khong con la mot buoc rieng:
    # RagRetrievalQualityTest do BM25 tren bo 132 cau hoi vang (4 ngon ngu) va tu do neu recall@3 < 0.85
    # hoac MRR < 0.70, nen sua knowledge base hay TextNormalizer ma lam tut thi build do ngay.
    - name: Build & Test Backend
      run: |
        cd backend/ticket-booking
        mvn -B clean package

    # Bao cao surefire cua lan chay do, de doc duoc test nao hong ma khong phai loi
    # nguoc log. Chi tai len khi build do nen khong ton dung luong cho lan chay xanh.
    - name: Upload Backend Test Reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: backend-surefire-reports
        path: backend/ticket-booking/target/surefire-reports/
        retention-days: 7

  # 2. Build & Test Frontend
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: my-react-app/package-lock.json
        
    - name: Install dependencies & Build Frontend
      run: |
        cd my-react-app
        npm install
        npm run build

    # Chặn "dịch sót": khoá gọi trong code mà bảng dịch không có, bảng en thiếu khoá so
    # với vi, hoặc chuỗi tiếng Việt viết cứng mới phát sinh. Nợ cũ đã đóng băng trong
    # scripts/i18n-baseline.json nên bước này chỉ đỏ khi có người thêm chỗ sót MỚI.
    - name: Check i18n
      run: |
        cd my-react-app
        npm run i18n:check

    # Kiểm tra kiểu từ JSDoc (tsc, không sinh file). Chỉ những file mở đầu bằng
    # `// @ts-check` mới bị soát — áp dần từng file, xem jsconfig.json. Vite KHÔNG tự
    # kiểm tra kiểu lúc build, nên sai tên prop/trường chỉ bị chặn ở bước này.
    - name: Typecheck
      run: |
        cd my-react-app
        npm run typecheck

    # Test đơn vị frontend (Vitest). Chạy sau build để lỗi build lộ ra trước,
    # nhưng vẫn chặn được job nếu logic vé/ghế/đếm ngược bị sửa hỏng.
    - name: Run Frontend Unit Tests
      run: |
        cd my-react-app
        npm run test:run

  # 3. Docker Build Test (Ensures Dockerfiles are correct)
  docker-test:
    needs: [build-backend, build-frontend, gitleaks]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Test Docker Compose Build
      run: docker compose build
