name: Ticket Booking CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 0. Security - Quét rò rỉ bí mật (Secret Detection)
  gitleaks:
    name: 🔐 Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Cần toàn bộ lịch sử Git để quét

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 1. Build & Test Backend
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build Backend with Maven
      run: |
        cd backend/ticket-booking
        mvn clean package -DskipTests

  # 2. Build & Test Frontend
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: my-react-app/package-lock.json
        
    - name: Install dependencies & Build Frontend
      run: |
        cd my-react-app
        npm install
        npm run build

  # 3. Docker Build Test (Ensures Dockerfiles are correct)
  docker-test:
    needs: [build-backend, build-frontend, gitleaks]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Test Docker Compose Build
      run: docker compose build
