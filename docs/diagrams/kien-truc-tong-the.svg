<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E6FD9"/>
    </marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C4DBE"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8496A8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- ===== Tiêu đề ===== -->
  <text x="60" y="54" font-size="30" font-weight="700" fill="#0F2B46">KIẾN TRÚC HỆ THỐNG TỔNG THỂ</text>
  <text x="60" y="82" font-size="14" fill="#5B7183">VigoTrip — Hệ thống đặt vé đa phương tiện · 3 tầng + dịch vụ ngoài</text>

  <!-- ===== TẦNG 1 — GIAO DIỆN ===== -->
  <rect x="60" y="110" width="1120" height="140" rx="14" fill="#F4F8FD" stroke="#D3E2F2" stroke-width="1.5"/>
  <rect x="84" y="126" width="26" height="26" rx="7" fill="#1E6FD9"/>
  <text x="97" y="144" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="122" y="145" font-size="16" font-weight="700" fill="#1E6FD9" letter-spacing="0.6">GIAO DIỆN NGƯỜI DÙNG</text>
  <text x="368" y="145" font-size="13" fill="#5B7183">React + Vite (SPA) · triển khai trên Vercel</text>

  <rect x="84" y="165" width="252" height="64" rx="10" fill="#FFFFFF" stroke="#C9D8EA" stroke-width="1.5"/>
  <text x="106" y="192" font-size="14.5" font-weight="700" fill="#12456F">Khách hàng</text>
  <text x="106" y="212" font-size="11.5" fill="#6B8199">tìm chuyến · chọn ghế · đặt vé</text>

  <rect x="352" y="165" width="252" height="64" rx="10" fill="#FFFFFF" stroke="#C9D8EA" stroke-width="1.5"/>
  <text x="374" y="192" font-size="14.5" font-weight="700" fill="#12456F">Nhà cung cấp</text>
  <text x="374" y="212" font-size="11.5" fill="#6B8199">quản lý chuyến · dashboard AI BI</text>

  <rect x="620" y="165" width="252" height="64" rx="10" fill="#FFFFFF" stroke="#C9D8EA" stroke-width="1.5"/>
  <text x="642" y="192" font-size="14.5" font-weight="700" fill="#12456F">Quản trị viên</text>
  <text x="642" y="212" font-size="11.5" fill="#6B8199">duyệt nhà cung cấp · giám sát</text>

  <rect x="888" y="165" width="268" height="64" rx="10" fill="#E8F1FD" stroke="#1E6FD9" stroke-width="1.8"/>
  <text x="910" y="192" font-size="14.5" font-weight="700" fill="#1E6FD9">Máy khách WebSocket</text>
  <text x="910" y="212" font-size="11.5" fill="#4A7BB5">sơ đồ ghế cập nhật tức thì</text>

  <!-- Mũi tên tầng 1 <-> tầng 2 -->
  <line x1="210" y1="250" x2="210" y2="294" stroke="#1E6FD9" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <text x="226" y="279" font-size="12" fill="#1E6FD9" font-weight="600">REST / JSON</text>
  <line x1="1030" y1="300" x2="1030" y2="256" stroke="#1E6FD9" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <text x="1014" y="279" font-size="12" fill="#1E6FD9" font-weight="600" text-anchor="end">WebSocket — đẩy trạng thái ghế</text>

  <!-- ===== TẦNG 2 — NGHIỆP VỤ &amp; AI ===== -->
  <rect x="60" y="300" width="1120" height="254" rx="14" fill="#F7F5FD" stroke="#DED5F2" stroke-width="1.5"/>
  <rect x="84" y="316" width="26" height="26" rx="7" fill="#7C4DBE"/>
  <text x="97" y="334" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="122" y="335" font-size="16" font-weight="700" fill="#7C4DBE" letter-spacing="0.6">NGHIỆP VỤ &amp; TRÍ TUỆ NHÂN TẠO</text>
  <text x="452" y="335" font-size="13" fill="#5B7183">Spring Boot (Java 17) · REST + WebSocket · Docker · triển khai trên Render</text>

  <rect x="84" y="355" width="520" height="176" rx="12" fill="#FFFFFF" stroke="#C9D8EA" stroke-width="1.5"/>
  <text x="106" y="385" font-size="16" font-weight="700" fill="#12456F">Nghiệp vụ đặt vé</text>
  <text x="106" y="414" font-size="13" fill="#35506B"><tspan fill="#1E6FD9" font-weight="700">•</tspan>  Đặt vé 3 loại hình · khóa ghế thời gian thực</text>
  <text x="106" y="440" font-size="13" fill="#35506B"><tspan fill="#1E6FD9" font-weight="700">•</tspan>  Thanh toán VNPay — Return URL + IPN (HMAC-SHA512)</text>
  <text x="106" y="466" font-size="13" fill="#35506B"><tspan fill="#1E6FD9" font-weight="700">•</tspan>  Voucher · hoàn tiền · soát vé QR</text>
  <text x="106" y="492" font-size="13" fill="#35506B"><tspan fill="#1E6FD9" font-weight="700">•</tspan>  JWT · RBAC · giới hạn tần suất</text>

  <rect x="636" y="355" width="520" height="176" rx="12" fill="#FFFFFF" stroke="#D8C9EE" stroke-width="1.5"/>
  <text x="658" y="385" font-size="16" font-weight="700" fill="#5B2E9D">Tầng Trí tuệ nhân tạo</text>
  <text x="658" y="414" font-size="13" fill="#35506B"><tspan fill="#7C4DBE" font-weight="700">•</tspan>  Trợ lý ảo RAG: ngữ nghĩa + BM25 → hợp nhất RRF</text>
  <text x="658" y="440" font-size="13" fill="#35506B"><tspan fill="#7C4DBE" font-weight="700">•</tspan>  AI BI: SQL tính số — LLM chỉ diễn giải</text>
  <text x="658" y="466" font-size="13" fill="#35506B"><tspan fill="#7C4DBE" font-weight="700">•</tspan>  Bộ điều phối LLM: Gemini ⇄ Groq (dự phòng)</text>
  <text x="658" y="492" font-size="13" fill="#35506B"><tspan fill="#7C4DBE" font-weight="700">•</tspan>  Ngắt mạch · suy giảm êm về BM25 · trần chi phí</text>

  <!-- Mũi tên tầng 2 -> tầng 3 -->
  <line x1="210" y1="554" x2="210" y2="598" stroke="#12866F" stroke-width="2.2" marker-end="url(#aGray)"/>
  <text x="226" y="583" font-size="12" fill="#12866F" font-weight="600">JPA / SQL</text>
  <line x1="896" y1="554" x2="896" y2="598" stroke="#7C4DBE" stroke-width="2.2" marker-end="url(#aPurple)"/>
  <text x="880" y="583" font-size="12" fill="#7C4DBE" font-weight="600" text-anchor="end">truy hồi chunk (vector + BM25)</text>

  <!-- ===== TẦNG 3 — DỮ LIỆU ===== -->
  <rect x="60" y="604" width="1120" height="156" rx="14" fill="#F1FAF7" stroke="#CDE9E0" stroke-width="1.5"/>
  <rect x="84" y="620" width="26" height="26" rx="7" fill="#12866F"/>
  <text x="97" y="638" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="122" y="639" font-size="16" font-weight="700" fill="#12866F" letter-spacing="0.6">DỮ LIỆU</text>
  <text x="252" y="639" font-size="13" fill="#5B7183">PostgreSQL trên Neon · kho tri thức RAG · bộ nhớ đệm</text>

  <rect x="84" y="658" width="340" height="84" rx="10" fill="#FFFFFF" stroke="#BFDFD4" stroke-width="1.5"/>
  <text x="106" y="686" font-size="14.5" font-weight="700" fill="#0E5C4E">PostgreSQL (Neon)</text>
  <text x="106" y="707" font-size="11.5" fill="#4E7A70">19 bảng · dữ liệu nghiệp vụ hợp nhất</text>
  <text x="106" y="726" font-size="11.5" fill="#4E7A70">khóa bi quan chống đặt trùng ghế</text>

  <rect x="450" y="658" width="340" height="84" rx="10" fill="#FFFFFF" stroke="#BFDFD4" stroke-width="1.5"/>
  <text x="472" y="686" font-size="14.5" font-weight="700" fill="#0E5C4E">Kho tri thức RAG</text>
  <text x="472" y="707" font-size="11.5" fill="#4E7A70">56 chunk · vector 768 chiều</text>
  <text x="472" y="726" font-size="11.5" fill="#4E7A70">chỉ mục BM25 · 57 câu hỏi vàng để đo</text>

  <rect x="816" y="658" width="340" height="84" rx="10" fill="#FFFFFF" stroke="#BFDFD4" stroke-width="1.5"/>
  <text x="838" y="686" font-size="14.5" font-weight="700" fill="#0E5C4E">Bộ nhớ đệm Caffeine</text>
  <text x="838" y="707" font-size="11.5" fill="#4E7A70">giữ ghế tạm 10 phút</text>
  <text x="838" y="726" font-size="11.5" fill="#4E7A70">cache tra cứu · giảm gọi API</text>

  <!-- ===== DỊCH VỤ NGOÀI ===== -->
  <rect x="1220" y="110" width="320" height="650" rx="14" fill="#F8FAFC" stroke="#DEE6EE" stroke-width="1.5"/>
  <text x="1244" y="146" font-size="15" font-weight="700" fill="#64748B" letter-spacing="0.6">DỊCH VỤ NGOÀI</text>

  <rect x="1244" y="172" width="272" height="80" rx="10" fill="#FFFFFF" stroke="#D5DEE7" stroke-width="1.5"/>
  <text x="1266" y="203" font-size="14.5" font-weight="700" fill="#38495B">VNPay Sandbox</text>
  <text x="1266" y="224" font-size="11.5" fill="#7A8A9A">cổng thanh toán</text>
  <text x="1266" y="242" font-size="11.5" fill="#7A8A9A">đối soát 2 kênh: Return URL + IPN</text>

  <rect x="1244" y="276" width="272" height="80" rx="10" fill="#FFFFFF" stroke="#D5DEE7" stroke-width="1.5"/>
  <text x="1266" y="307" font-size="14.5" font-weight="700" fill="#38495B">Google OAuth</text>
  <text x="1266" y="328" font-size="11.5" fill="#7A8A9A">đăng nhập một chạm</text>
  <text x="1266" y="346" font-size="11.5" fill="#7A8A9A">không tự lưu mật khẩu bên thứ ba</text>

  <rect x="1244" y="380" width="272" height="80" rx="10" fill="#FFFFFF" stroke="#D5DEE7" stroke-width="1.5"/>
  <text x="1266" y="411" font-size="14.5" font-weight="700" fill="#38495B">SMTP Email</text>
  <text x="1266" y="432" font-size="11.5" fill="#7A8A9A">gửi vé điện tử · mã QR</text>
  <text x="1266" y="450" font-size="11.5" fill="#7A8A9A">thông báo trạng thái đơn</text>

  <rect x="1244" y="484" width="272" height="80" rx="10" fill="#F7F5FD" stroke="#D8C9EE" stroke-width="1.8"/>
  <text x="1266" y="515" font-size="14.5" font-weight="700" fill="#5B2E9D">Gemini API</text>
  <text x="1266" y="536" font-size="11.5" fill="#7C6B96">sinh câu trả lời + embedding</text>
  <text x="1266" y="554" font-size="11.5" fill="#7C6B96">gemini-embedding-001 · 768 chiều</text>

  <rect x="1244" y="588" width="272" height="80" rx="10" fill="#F7F5FD" stroke="#D8C9EE" stroke-width="1.8"/>
  <text x="1266" y="619" font-size="14.5" font-weight="700" fill="#5B2E9D">Groq API</text>
  <text x="1266" y="640" font-size="11.5" fill="#7C6B96">nhà cung cấp dự phòng</text>
  <text x="1266" y="658" font-size="11.5" fill="#7C6B96">tự chuyển khi Gemini quá tải</text>

  <text x="1380" y="702" font-size="11.5" fill="#8496A8" text-anchor="middle">Mọi lời gọi ra ngoài đều đi qua tầng nghiệp vụ —</text>
  <text x="1380" y="722" font-size="11.5" fill="#8496A8" text-anchor="middle">khóa bí mật không bao giờ nằm ở trình duyệt.</text>

  <!-- Mũi tên tầng 2 <-> dịch vụ ngoài -->
  <line x1="1180" y1="440" x2="1216" y2="440" stroke="#8496A8" stroke-width="2.2" marker-end="url(#aGray)" marker-start="url(#aGray)"/>
  <text x="1198" y="425" font-size="11" fill="#64748B" font-weight="600" text-anchor="middle">HTTPS</text>

  <!-- ===== Thanh dưới ===== -->
  <rect x="60" y="790" width="1480" height="76" rx="14" fill="#0F2B46"/>
  <text x="88" y="818" font-size="12" font-weight="700" fill="#8FC4FF" letter-spacing="0.8">PHÒNG VỆ 2 LỚP CHỐNG ĐẶT TRÙNG GHẾ</text>
  <text x="88" y="843" font-size="12.5" fill="#E6EEF7">Lớp ngoài — giữ ghế 10 phút + phát WebSocket (báo sớm)  ·  Lớp trong — khóa bi quan tại CSDL khi ghi đơn (bảo đảm tuyệt đối)</text>
  <text x="1512" y="818" font-size="12" font-weight="700" fill="#8FC4FF" letter-spacing="0.8" text-anchor="end">TRIỂN KHAI</text>
  <text x="1512" y="843" font-size="12.5" fill="#E6EEF7" text-anchor="end">Vercel · Render · Neon · CI/CD GitHub Actions</text>
</svg>
