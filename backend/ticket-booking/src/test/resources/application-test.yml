spring:
  application:
    name: booking-service-test
  datasource:
    url: jdbc:h2:mem:ticket_booking_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  cache:
    type: none
  mail:
    host: localhost
    port: 2525
    username: test@example.com
    password: testpassword

# Tắt cổng chặn lượt quét (PendingBookingSignal) trong test: cổng giữ trạng thái trong RAM và
# dùng chung cho cả context, nên một test kết thúc với DB sạch sẽ đóng cổng và làm test sau bị
# bỏ qua lượt quét. Bản thân logic của cổng được phủ riêng bởi PendingBookingSignalTest.
booking:
  cleanup:
    safety-sweep-minutes: 0

jwt:
  secret: dGVzdHNlY3JldGtleWZvcmp1bml0dGVzdGluZ3B1cnBvc2Vzb25seTEyMzQ1Njc4OTA=
  expiration: 86400000

vnpay:
  tmn-code: TEST_TMN
  hash-secret: TEST_SECRET
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:8081/api/payment/vnpay-return
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
  # Test không gọi ra Internet; phần logic querydr được phủ riêng bởi VNPayQueryServiceTest.
  verify-callback: false

app:
  frontend-url: http://localhost:5173
  # Test KHÔNG được gọi mạng. Tắt hẳn ở đây thì dù có test nào chạm vào đường dự báo thời tiết,
  # nó cũng dừng ngay tại service chứ không đi ra Open-Meteo. Phần logic được phủ riêng bởi
  # WeatherServiceTest và OpenMeteoClientTest với RestTemplate giả lập.
  weather:
    enabled: false
  admin:
    email: admin@gmail.com
    password: Abc123456!
  provider:
    email: provider@gmail.com
    password: Abc123456!
    owned-providers: Vietnam Airlines,Vietjet Air,Bamboo Airways

gemini:
  api-key: test-dummy-gemini-api-key-1234567890

# Test KHÔNG được gọi mạng. api-key rỗng khiến embedding client tự báo không khả dụng,
# nên seeder vẫn chạy (vẫn kiểm chứng được phần đọc YAML và ghi DB trên H2) nhưng không
# gọi API nào, và HybridRetriever lùi về BM25 thuần — đúng đường đi khi thiếu key.
rag:
  embedding:
    api-key: ""

GEMINI_API_KEY: test-dummy-gemini-api-key-1234567890
SPRING_DATASOURCE_PASSWORD: testpassword
SPRING_MAIL_PASSWORD: testpassword
JWT_SECRET: dGVzdHNlY3JldGtleWZvcmp1bml0dGVzdGluZ3B1cnBvc2Vzb25seTEyMzQ1Njc4OTA=
VNP_HASH_SECRET: TEST_SECRET
VNP_TMN_CODE: TEST_TMN
