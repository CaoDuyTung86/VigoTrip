spring:
  application:
    name: booking-service
  datasource:
    # Cấu hình MS SQL Server 
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=ticket_booking_db;encrypt=true;trustServerCertificate=true;}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:Toibingu1234}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 10
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.SQLServerDialect}
        use_nationalized_character_data: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:tunggaming9874123@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000

# VNPay Sandbox Configuration (Demo credentials từ sandbox.vnpayment.vn)
vnpay:
  tmn-code: ${VNP_TMN_CODE:2N4UDJHA}
  hash-secret: ${VNP_HASH_SECRET:AGZ0GSAWUPR788U3WZ2B1BG3AGVTBUQY}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNP_RETURN_URL:http://localhost:8081/api/payment/vnpay-return}
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

# Frontend URL (dùng cho redirect sau thanh toán VNPay)
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD:Abc123456!}
  provider:
    email: ${PROVIDER_EMAIL:provider@gmail.com}
    password: ${PROVIDER_PASSWORD:Abc123456!}

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics, caches
  health:
    mail:
      enabled: false
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Gemini AI Configuration
gemini:
  api-key: ${GEMINI_API_KEY:}

# Google OAuth2 — dùng để verify Google ID Token phía server
# Lấy Client ID từ: https://console.cloud.google.com → Credentials → OAuth 2.0 Client IDs
google:
  client-id: ${GOOGLE_CLIENT_ID:}
