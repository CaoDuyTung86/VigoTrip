spring:
  application:
    name: booking-service
  datasource:
    # Cấu hình MS SQL Server 
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://host.docker.internal:1433;databaseName=ticket_booking_db;encrypt=true;trustServerCertificate=true;}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 10
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
        use_nationalized_character_data: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:tunggaming9874123@gmail.com}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# VNPay Sandbox Configuration (Demo credentials từ sandbox.vnpayment.vn)
vnpay:
  tmn-code: ${VNP_TMN_CODE:3JZ7QBUX}
  hash-secret: ${VNP_HASH_SECRET}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNP_RETURN_URL:http://localhost:8081/api/payment/vnpay-return}
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      enabled: true

# Gemini AI Configuration
gemini:
  api-key: ${GEMINI_API_KEY}
