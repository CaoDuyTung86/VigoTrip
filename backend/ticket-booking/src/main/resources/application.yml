spring:
  application:
    name: booking-service
  # Chữ trong mail gửi đi (messages*.properties).
  #
  # fallback-to-system-locale: false là bắt buộc, không phải tuỳ chọn. Để true thì khi
  # người nhận chọn ja/zh (chưa dịch), Spring lấy locale CỦA MÁY CHỦ làm bản dự phòng —
  # tức là chữ trong mail phụ thuộc vào cấu hình của cái container đang chạy, mỗi nơi
  # deploy một kiểu. Để false thì bản dự phòng luôn là messages.properties (tiếng Anh).
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    # Cấu hình MS SQL Server 
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=ticket_booking_db;encrypt=true;trustServerCertificate=true;}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 10
      idle-timeout: 30000
      # minimum-idle: 0 mới làm idle-timeout ở trên có tác dụng. Mặc định của HikariCP là
      # minimumIdle = maximumPoolSize, và idleTimeout CHỈ được áp dụng khi minimumIdle nhỏ hơn
      # maximumPoolSize — nghĩa là pool giữ đủ 10 kết nối mở vĩnh viễn kể cả lúc không ai dùng.
      # Neon tính tiền theo thời gian compute THỨC, không theo số truy vấn, nên mỗi kết nối
      # treo là tiền. Đổi lại: sau một quãng nghỉ, request đầu tiên phải mở kết nối mới
      # (connection-timeout 60s đủ rộng cho cả lúc Neon phải tỉnh dậy).
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.SQLServerDialect}
        use_nationalized_character_data: true
        # Gom lệnh ghi thành lô thay vì mỗi hàng một vòng gọi tới CSDL.
        #
        # Có tác dụng rõ nhất ở bước tính lại giá chuyến lúc khởi động: cửa sổ tồn kho 30 ngày
        # cỡ tám nghìn rưỡi chuyến, lượt chạy đầu sau khi đổi cách tính phải UPDATE gần hết
        # chỗ đó. Với Neon đặt ở xa thì tám nghìn rưỡi vòng gọi lẻ là vài phút chết cứng lúc
        # khởi động; gom lô đưa nó về vài giây.
        #
        # Không giúp gì cho INSERT: khoá chính đang dùng GenerationType.IDENTITY, mà Hibernate
        # bắt buộc phải lấy khoá vừa sinh ngay sau mỗi dòng nên tự tắt gom lô cho INSERT.
        # order_updates đi kèm batch_size: không sắp cùng bảng lại với nhau thì lô bị cắt vụn.
        jdbc:
          batch_size: 50
        order_updates: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Brevo — đường gửi mail qua HTTPS, thay cho SMTP.
# BẮT BUỘC trên Render: Render chặn outbound port 25/465/587 nên SMTP Gmail luôn
# timeout (MailConnectException). Bỏ trống key thì MailConfig tự quay về SMTP,
# tiện cho chạy local.
brevo:
  api-key: ${BREVO_API_KEY:}
  sender:
    # Phải là địa chỉ đã verify trong Brevo (Senders & IP), nếu không API trả 400.
    email: ${BREVO_SENDER_EMAIL:${SPRING_MAIL_USERNAME:}}
    name: ${BREVO_SENDER_NAME:VigoTrip}

server:
  port: ${PORT:8080}

# Các biến BẮT BUỘC bên dưới cố tình không có giá trị mặc định. Repo này công khai, nên
# một giá trị mặc định hợp lệ nằm trong mã nguồn đồng nghĩa với việc công bố bí mật đang
# chạy thật. Thiếu biến thì StartupSecretsValidator chặn ngay lúc khởi động — hỏng lúc
# deploy dễ chịu hơn nhiều so với âm thầm chạy bằng khoá ai cũng đọc được.
# Danh sách đầy đủ và cách lấy từng giá trị: xem .env.example.
jwt:
  secret: ${JWT_SECRET:}
  # Hạn của ACCESS TOKEN, tính bằng mili-giây. 15 phút, trước đây là 24 giờ.
  #
  # Con số này chính là "cửa sổ thiệt hại" của một token bị lộ, vì JWT không thu hồi được:
  # đã ký ra là có hiệu lực tới đúng giây hết hạn, bấm đăng xuất cũng không rút lại được.
  # 24 giờ nghĩa là một token rơi vào tay người khác (qua XSS, qua log, qua máy dùng chung)
  # mở được tài khoản suốt một ngày. 15 phút thì không.
  #
  # Rút ngắn được là nhờ có refresh token bên dưới gánh phần "giữ người dùng đăng nhập lâu";
  # đừng hạ con số này thêm nữa mà không đo lại: mỗi lần hết hạn là một vòng /refresh, và
  # trên Render free tier thì một request thừa lúc container vừa ngủ dậy là 30-60 giây chờ.
  expiration: ${JWT_EXPIRATION:900000}

  # REFRESH TOKEN — chuỗi ngẫu nhiên 256 bit, nằm trong cookie HttpOnly, lưu dưới dạng
  # SHA-256 trong bảng phien_dang_nhap. Xem RefreshToken.java và docs/BAO_MAT_XAC_THUC.md.
  refresh:
    # Không hoạt động bao nhiêu ngày thì phiên chết. Mỗi lần /refresh gia hạn lại từ đầu.
    idle-days: ${JWT_REFRESH_IDLE_DAYS:14}
    # Trần cứng tính từ lúc đăng nhập, bất kể hoạt động dày tới đâu. Không có nó thì một
    # phiên bị chiếm mà kẻ chiếm siêng gọi /refresh sẽ sống vĩnh viễn.
    absolute-days: ${JWT_REFRESH_ABSOLUTE_DAYS:60}
    # Cửa sổ tha thứ cho việc gọi /refresh trùng nhau (nhiều tab, retry sau khi mất mạng).
    # 0 = nghiêm ngặt tuyệt đối. Đọc handleAlreadyRevoked() trước khi đổi — đây là đánh đổi
    # giữa "đăng xuất oan người thật" và "bỏ lọt một cửa sổ vài giây cho kẻ trộm".
    reuse-grace-seconds: ${JWT_REFRESH_REUSE_GRACE_SECONDS:10}
    cleanup-cron: ${JWT_REFRESH_CLEANUP_CRON:0 5 4 * * *}

# VNPay Sandbox. tmn-code/hash-secret lấy ở sandbox.vnpayment.vn, KHÔNG hardcode:
# hash-secret là thứ duy nhất chứng minh một callback thật sự đến từ cổng thanh toán.
vnpay:
  tmn-code: ${VNP_TMN_CODE:}
  hash-secret: ${VNP_HASH_SECRET:}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNP_RETURN_URL:http://localhost:8081/api/payment/vnpay-return}
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
  # Sau khi một callback (Return/IPN) khai là thanh toán thành công, gọi lệnh querydr sang
  # api-url để hỏi lại chính cổng xem giao dịch đó có thật không. Chữ ký HMAC chỉ chứng minh
  # người gửi biết hash-secret; lớp này chặn cả trường hợp hash-secret bị lộ.
  # Chỉ tắt khi môi trường không có đường ra Internet (dev offline, CI).
  verify-callback: ${VNP_VERIFY_CALLBACK:true}

# Nhật ký giao dịch (bảng nhat_ky_thanh_toan).
# Ghi lại nguyên văn mọi callback từ cổng, mọi lượt querydr và mọi quyết định hoàn tiền.
# Log ứng dụng KHÔNG thay thế được: container restart là chứng cứ biến mất, mà tranh chấp
# tiền nong thì thường nổ ra sau đó vài ngày.
payment:
  audit:
    enabled: ${PAYMENT_AUDIT_ENABLED:true}
    # Dài hơn hẳn lịch sử chat (180 so với 30 ngày): đối soát với ngân hàng và khiếu nại của
    # khách đều tính bằng tháng. Một callback dài khoảng 600 ký tự nên chi phí lưu là nhỏ.
    retention-days: ${PAYMENT_AUDIT_RETENTION_DAYS:180}
    # 3h15 — lệch khỏi các job dọn chat (3h00, 3h30, 3h45) để không có hai lệnh DELETE lớn
    # chạy chồng lên nhau.
    cleanup-cron: ${PAYMENT_AUDIT_CLEANUP_CRON:0 15 3 * * *}

# Frontend URL (dùng cho redirect sau thanh toán VNPay)
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  trip-supply:
    # Bật thì mỗi lần khởi động sẽ tính lại giờ đến và giá của mọi chuyến CHƯA khởi hành theo
    # mô hình hiện hành (cự ly thật giữa hai thành phố, mùa vụ đi lại, khung giờ). Phải bật ít
    # nhất một lần sau khi đổi cách tính, vì bước bù chuyến chỉ THÊM phần còn thiếu chứ không
    # bao giờ sửa chuyến đã có — không tính lại thì dữ liệu cũ còn nằm đó tới hết tầm 30 ngày.
    #
    # Chạy lần hai trở đi gần như không ghi gì: mô hình tất định nên chuyến đã khớp thì bỏ qua.
    #
    # Tắt nếu có sửa giá tay trên màn quản trị và muốn giữ nguyên: hàm tính lại không phân biệt
    # được chuyến do hệ thống sinh với chuyến do người sửa, nên nó kéo hết về mức của mô hình.
    realign-on-startup: ${TRIP_REALIGN_ON_STARTUP:true}
  weather:
    # Dự báo thời tiết cho điểm đến, hiện ở trang chi tiết chuyến và danh sách vé sắp đi.
    #
    # Open-Meteo miễn phí cho dùng phi thương mại và KHÔNG cần khoá, nên đây là tính năng ngoài
    # duy nhất không thêm biến bí mật nào. Giấy phép CC-BY-4.0 bắt ghi nguồn: dòng "Open-Meteo"
    # nằm ngay dưới khối thời tiết, đừng bỏ đi.
    #
    # Tắt bằng enabled=false thì endpoint vẫn còn nhưng luôn trả 204, và giao diện tự ẩn khối
    # thời tiết — giống hệt cách hệ thống xử lý khi thiếu khoá AI hay khoá gửi thư.
    enabled: ${WEATHER_ENABLED:true}
    base-url: ${WEATHER_BASE_URL:https://api.open-meteo.com/v1/forecast}
    # Múi giờ để Open-Meteo cắt ngày cho đúng. Lấy giờ Đông Dương vì mọi điểm trong danh mục
    # đều ở Việt Nam; cắt theo UTC thì dự báo "ngày 14" lệch mất bảy tiếng.
    timezone: Asia/Bangkok
    # Ngắn có chủ ý: khối thời tiết ẩn đi thì không sao, giữ thread request của Render thì có sao.
    connect-timeout-seconds: 3
    read-timeout-seconds: 4
  # Các origin frontend được phép nhận redirect sau khi VNPay trả kết quả.
  # Cổng chỉ gọi ngược về backend, nên backend là bên quyết định đưa khách về đâu; trả về
  # sai tên miền là khách rơi vào một phiên khác (cookie đăng nhập gắn theo tên miền) và bị
  # đá ra khỏi phiên đang dùng.
  # Đây là allowlist chứ không phải giá trị tin cậy tuyệt đối: origin do client gửi lên,
  # không lọc thì thành open redirect. Thêm tên miền mới vào đây khi đổi chỗ deploy.
  allowed-frontend-origins: ${ALLOWED_FRONTEND_ORIGINS:https://vigotrip.vercel.app,https://datxe.duckdns.org,http://localhost:5173}
  # Tên miền được phép mở WebSocket tới máy chủ này.
  #
  # Trước đây WebSocketConfig để setAllowedOriginPatterns("*"): bất kỳ trang web nào cũng mở
  # được kết nối STOMP từ trình duyệt của người dùng. Cộng với việc kênh khi đó không xác
  # thực, một trang bất kỳ chỉ cần vài dòng JavaScript là đọc được toàn bộ luồng chọn ghế và
  # nhả ghế người khác đang giữ.
  #
  # Để mẫu "https://*.vercel.app" vì mỗi bản deploy xem trước lại được cấp một tên miền mới;
  # liệt kê cứng từng tên miền sẽ khiến bản xem trước gãy rồi lại bị nới về "*" cho xong.
  websocket:
    allowed-origin-patterns: ${WS_ALLOWED_ORIGIN_PATTERNS:https://vigotrip.vercel.app,https://*.vercel.app,https://datxe.duckdns.org,https://*.ngrok-free.dev,http://localhost:*}
    # Trần tần suất frame trên MỖI PHIÊN STOMP. RateLimitingFilter không với tới được:
    # nó là servlet filter, mà WebSocket chỉ bắt tay HTTP đúng một lần rồi mọi frame đi
    # trong kết nối đã mở.
    #
    # burst phải lớn hơn số ghế tối đa một người chọn được một lần (mỗi ghế là một frame,
    # gửi liền nhau trong vài mili giây), nếu không thao tác chọn nhóm bị chặn nhầm.
    # frames-per-second khống chế tốc độ về lâu dài. Vượt trần thì frame bị BỎ chứ không
    # ngắt kết nối; vượt quá max-violations lần trong một phiên mới ngắt hẳn.
    rate-limit:
      frames-per-second: ${WS_RATE_LIMIT_FPS:10}
      burst: ${WS_RATE_LIMIT_BURST:40}
      max-violations: ${WS_RATE_LIMIT_MAX_VIOLATIONS:20}
  # URL công khai của chính backend. Dùng để nhúng ảnh QR vào email — client mail nằm
  # ngoài mạng nội bộ nên localhost không dùng được khi deploy.
  backend-url: ${BACKEND_URL:http://localhost:8080}
  # Số proxy tin cậy đứng trước ứng dụng (mỗi proxy nối thêm 1 mục vào X-Forwarded-For).
  # 0 = chạy trực tiếp/dev local. 1 = sau Render. 2 = sau Vercel rewrite -> Render.
  # Đặt CAO hơn thực tế sẽ cho phép client giả mạo IP để né rate limit — khi không
  # chắc, cứ để 0 (nhiều client dùng chung hạn mức, phiền nhưng an toàn).
  trusted-proxy-count: ${APP_TRUSTED_PROXY_COUNT:0}
  auth:
    refresh-cookie:
      # auto = suy ra từ scheme thật của request (X-Forwarded-Proto khi đứng sau proxy).
      # Chỉ ép true/false khi biết chắc mình đang làm gì: ép true trên môi trường http sẽ
      # khiến trình duyệt lặng lẽ vứt cookie đi, không lỗi, không cảnh báo — chỉ là đăng
      # nhập xong tải lại trang là mất phiên.
      secure: ${AUTH_REFRESH_COOKIE_SECURE:auto}
      # Lax đúng cho kiến trúc hiện tại vì frontend gọi /api qua rewrite của Vercel (và qua
      # Nginx ở bản AWS) nên với trình duyệt là cùng một site. Đổi sang None CHỈ khi frontend
      # gọi thẳng sang tên miền backend — và lúc đó lá chắn CSRF này biến mất, phải bù bằng
      # cơ chế khác. Xem RefreshCookieFactory.
      same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
  # Cho phép khởi động dù một bí mật đang dùng nằm trong danh sách đã lộ (xem
  # StartupSecretsValidator). Chỉ đặt true khi CHƯA xoay được khoá và chấp nhận rủi ro —
  # mỗi lần khởi động sẽ in một khối cảnh báo. Xoay khoá xong thì bỏ biến này.
  allow-known-leaked-secrets: ${ALLOW_KNOWN_LEAKED_SECRETS:false}
  # AdminSeeder ĐỒNG BỘ mật khẩu về đúng giá trị hai biến này ở MỖI lần khởi động, nên
  # đổi mật khẩu trong ứng dụng sẽ bị ghi đè ở lần restart kế tiếp. Muốn đổi thật thì sửa
  # biến môi trường rồi restart.
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD:}
  provider:
    email: ${PROVIDER_EMAIL:provider@gmail.com}
    password: ${PROVIDER_PASSWORD:}
    # Những thương hiệu mà tài khoản đối tác demo vận hành, khớp nha_cung_cap.provider_name.
    #
    # Hệ thống có 8 nhà cung cấp nhưng chỉ dựng MỘT tài khoản đối tác để còn nhớ mật khẩu
    # lúc demo. Mô hình đại lý tổng (một đối tác quản lý nhiều thương hiệu) là cách cho phép
    # điều đó mà vẫn giữ đúng luật "đối tác chỉ xem được số liệu của chính mình" — trước đây
    # ROLE_PROVIDER đọc được doanh thu của cả đối thủ.
    #
    # Danh sách nhiều hay ít không ảnh hưởng tới code: để đúng một tên là quay về mô hình
    # 1 đối tác = 1 hãng, cần đổi thì sửa biến môi trường chứ không phải sửa mã.
    owned-providers: ${PROVIDER_OWNED:Vietnam Airlines,Vietjet Air,Bamboo Airways}
  demo:
    # Sinh lịch sử đặt vé cho tháng này và tháng trước, phục vụ demo màn Thống kê doanh thu.
    #
    # MẶC ĐỊNH TẮT và phải giữ nguyên như vậy: đây là dữ liệu bịa, bật nhầm trên môi trường
    # thật là doanh thu báo cáo sai. Chỉ đặt DEMO_SEED_BOOKINGS=true trên bản demo, và cũng
    # chỉ cần bật đúng một lần — seeder tự bỏ qua khi tháng liền trước đã đủ số đơn.
    seed-bookings: ${DEMO_SEED_BOOKINGS:false}

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics, caches
  health:
    mail:
      enabled: false
    # Render ping /actuator/health định kỳ suốt vòng đời instance (không chỉ lúc deploy) để
    # quyết định có restart service hay không. Mặc định Spring Boot gắn DataSourceHealthIndicator
    # vào đây, nên mỗi lần Render ping là một truy vấn xuống Neon — đủ dày để phá hỏng cả việc
    # minimum-idle: 0 lẫn PendingBookingSignal (xem §12 docs/THANH_TOAN_VNPAY.md), vì Neon chỉ
    # ngủ được sau 5 phút không có truy vấn nào. Tắt riêng nhánh DB, các chỉ báo khác (disk,
    # ping...) vẫn chạy bình thường. Đánh đổi: Render không còn tự phát hiện "DB chết" qua
    # health check — cleanup service và retry logic đã tự chịu được DB lỗi tạm thời.
    db:
      enabled: false
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Gemini AI Configuration
gemini:
  api-key: ${GEMINI_API_KEY:}

# Cấu hình tầng LLM (Multi-model Gateway)
llm:
  timeouts:
    connect-seconds: ${LLM_CONNECT_TIMEOUT:5}
    read-seconds: ${LLM_READ_TIMEOUT:30}

  # Chuỗi nhà cung cấp cho từng tác vụ, thử theo đúng thứ tự khai báo.
  # Nhà cung cấp nào bỏ trống api-key sẽ bị LOẠI lúc khởi động — nhờ vậy Groq/OpenRouter
  # hoàn toàn tùy chọn, không cấu hình thì hệ thống chạy y như trước.
  tasks:
    chat:
      - name: gemini
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        api-key: ${GEMINI_API_KEY:}
        # flash-lite: quota free tier cao hơn, vẫn đủ mạnh cho function calling
        model: ${GEMINI_CHAT_MODEL:gemini-flash-lite-latest}
        max-tokens: 800
        temperature: 0.7
      - name: groq
        base-url: https://api.groq.com/openai/v1
        api-key: ${GROQ_API_KEY:}
        # Groq đổi danh mục model khá thường xuyên. Nếu log báo 404 "model does not
        # exist", liệt kê model hiện có bằng:
        #   curl https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY"
        model: ${GROQ_CHAT_MODEL:openai/gpt-oss-120b}
        max-tokens: 800
        temperature: 0.7
    analysis:
      - name: gemini
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        api-key: ${GEMINI_API_KEY:}
        # "gemini-flash-latest" hay trả 503 với payload báo cáo BI lớn; flash-lite ổn định hơn.
        model: ${GEMINI_ANALYSIS_MODEL:gemini-flash-lite-latest}
        max-tokens: 4000
        temperature: 0.3
      - name: groq
        base-url: https://api.groq.com/openai/v1
        api-key: ${GROQ_API_KEY:}
        model: ${GROQ_ANALYSIS_MODEL:openai/gpt-oss-120b}
        max-tokens: 4000
        temperature: 0.3

  history:
    max-pairs: ${LLM_HISTORY_MAX_PAIRS:3}
    max-content-length: ${LLM_HISTORY_MAX_CONTENT:200}

  tools:
    # Số lần gọi model trong một lượt chat. 2 = hỏi rồi trả lời, không nối được chuỗi;
    # 3 cho phép tra một thứ rồi tra tiếp dựa trên kết quả vừa tra được, ví dụ đọc đơn
    # hàng xong mới biết hỏi thời tiết ở nơi nào. Lượt cuối luôn gọi KHÔNG kèm tool nên
    # model buộc phải trả lời bằng chữ.
    max-rounds: ${LLM_TOOL_MAX_ROUNDS:3}
    # Trần tổng số lần chạy tool trong một lượt, cộng dồn qua mọi vòng. Trần vòng lặp một
    # mình không đủ vì model xin được nhiều tool trong cùng một vòng.
    max-calls-per-turn: ${LLM_TOOL_MAX_CALLS:8}

  circuit-breaker:
    failure-threshold: ${LLM_CIRCUIT_FAILURE_THRESHOLD:3}
    # Hết ngần này giây thì mạch chuyển HALF_OPEN: đúng MỘT request được dùng làm phép
    # thử, phần còn lại vẫn đi nhà dự phòng cho tới khi biết kết quả.
    # Mỗi vòng mở mạch liên tiếp nhân đôi con số này (60 → 120 → 240...), về lại 60 khi
    # có một lần thành công.
    open-seconds: ${LLM_CIRCUIT_OPEN_SECONDS:60}
    # Trần sau khi nhân đôi. 15 phút: đủ thưa để không đốt request vô ích vào nhà đang
    # chết, vẫn đủ dày để nhận ra nó sống lại.
    max-open-seconds: ${LLM_CIRCUIT_MAX_OPEN_SECONDS:900}
    # Chốt chặn chống kẹt suất thăm dò, không phải timeout HTTP. Dài hơn stream 120s.
    probe-timeout-seconds: ${LLM_CIRCUIT_PROBE_TIMEOUT_SECONDS:180}

  retry:
    # Cố tình để thấp: khi đã có nhà cung cấp dự phòng thì chuyển nhà nhanh hơn
    # nhiều so với ngồi retry một endpoint đang quá tải.
    max-attempts: ${LLM_RETRY_ATTEMPTS:2}
    backoff-ms: ${LLM_RETRY_BACKOFF_MS:1000}
  budget:
    # Trần tổng số request AI/ngày cho TOÀN hệ thống. Chốt chặn cuối chống việc
    # đốt sạch quota Gemini free tier; rate limit theo IP không đủ khi bị tấn công
    # từ nhiều nguồn. Đếm trong bộ nhớ tiến trình (hợp với kiến trúc 1 container).
    daily-request-cap: ${LLM_DAILY_REQUEST_CAP:2000}

# Lịch sử hội thoại chatbot.
# CHỈ lưu với người dùng đã đăng nhập; khách vãng lai không được lưu gì vì họ không có
# cách nào xem lại hay yêu cầu xóa dữ liệu của mình.
chat:
  history:
    enabled: ${CHAT_HISTORY_ENABLED:true}
    # Tin nhắn chat có thể chứa thông tin cá nhân — giữ vô thời hạn là không nên.
    retention-days: ${CHAT_HISTORY_RETENTION_DAYS:30}
    max-messages-returned: ${CHAT_HISTORY_MAX_RETURNED:50}
    cleanup-cron: ${CHAT_HISTORY_CLEANUP_CRON:0 0 3 * * *}
  # Đánh giá 👍/👎 cho câu trả lời của bot. Điểm số là ẩn danh và giữ lâu dài; riêng câu
  # hỏi kèm theo bị xóa trắng sau retention-days ở trên, xem ChatFeedbackService.
  feedback:
    enabled: ${CHAT_FEEDBACK_ENABLED:true}
    cleanup-cron: ${CHAT_FEEDBACK_CLEANUP_CRON:0 30 3 * * *}
    # Chỉ nhận đánh giá cho mã câu trả lời mà server đã thực sự cấp (ChatMessageRefRegistry).
    # Sổ nằm trong bộ nhớ: hạn dài thì người dùng quay lại tab cũ hôm sau vẫn chấm điểm được,
    # hạn ngắn thì sổ gọn hơn. Server khởi động lại là sổ trắng — với người đã đăng nhập còn
    # đường kiểm tra thứ hai qua lịch sử trong DB.
    ref-ttl-hours: ${CHAT_FEEDBACK_REF_TTL_HOURS:24}
    ref-max-entries: ${CHAT_FEEDBACK_REF_MAX_ENTRIES:50000}
  # Số đo vận hành từng lượt chat: không nội dung, không danh tính (xem ChatTurnMetric).
  # Giữ lâu hơn tin nhắn vì so sánh theo tháng mới thấy xu hướng, mà giữ lại không đánh
  # đổi gì về quyền riêng tư.
  metrics:
    enabled: ${CHAT_METRICS_ENABLED:true}
    retention-days: ${CHAT_METRICS_RETENTION_DAYS:90}
    max-issues-returned: ${CHAT_METRICS_MAX_ISSUES:20}
    cleanup-cron: ${CHAT_METRICS_CLEANUP_CRON:0 45 3 * * *}

# Retrieval-Augmented Generation: tri thức chatbot đọc từ bảng tri_thuc,
# nguồn gốc là resources/knowledge/*.yml
rag:
  enabled: ${RAG_ENABLED:true}
  # Số chunk nhét vào prompt. Cao hơn sẽ loãng ngữ cảnh và tốn token.
  top-k: ${RAG_TOP_K:4}
  candidates-per-branch: ${RAG_CANDIDATES:10}
  # Ngưỡng cosine cho nhánh ngữ nghĩa; dưới ngưỡng coi như không liên quan.
  min-similarity: ${RAG_MIN_SIMILARITY:0.55}
  seed-on-startup: ${RAG_SEED_ON_STARTUP:true}

  embedding:
    base-url: https://generativelanguage.googleapis.com/v1beta/openai
    # Dùng chung key với chat. Bỏ trống = tắt tìm kiếm ngữ nghĩa, hệ thống tự
    # lùi về BM25 thuần (dev local và CI vẫn chạy được chatbot bình thường).
    api-key: ${GEMINI_API_KEY:}
    # LƯU Ý: tên model embedding của Google hay đổi. Nếu log báo 404 model không
    # tồn tại, chạy `node test_gemini_models.js` ở thư mục gốc để xem model khả
    # dụng với key hiện tại rồi đặt lại biến này.
    model: ${RAG_EMBEDDING_MODEL:gemini-embedding-001}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:768}
    batch-size: ${RAG_EMBEDDING_BATCH_SIZE:32}

# Google OAuth2 — dùng để verify Google ID Token phía server
# Lấy Client ID từ: https://console.cloud.google.com → Credentials → OAuth 2.0 Client IDs
google:
  client-id: ${GOOGLE_CLIENT_ID:}
