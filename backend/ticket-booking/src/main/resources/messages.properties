# Chữ trong mail gửi đi — BẢN MẶC ĐỊNH (tiếng Anh).
#
# Vì sao bản mặc định lại là tiếng Anh chứ không phải tiếng Việt: file này là thứ Spring
# rơi về khi người nhận chọn một ngôn ngữ chưa dịch (hiện là ja và zh) hoặc khi một khoá
# thiếu ở bản dịch. Tiếng Anh là bản đọc được với nhiều người nhất trong tình huống đó.
# Người dùng tiếng Việt không bao giờ chạm tới file này — họ đọc messages_vi.properties,
# và ngôn ngữ mặc định của tài khoản chưa chọn gì cũng là 'vi' (xem SupportedLocales).
#
# LƯU Ý cú pháp: ở những dòng có tham số {0}, dấu nháy đơn phải viết gấp đôi ('') vì
# MessageFormat coi nháy đơn là ký tự thoát. Cách an toàn hơn là đừng dùng nháy đơn.

# ==== Dùng chung ====
mail.hello=Hello,
mail.regards=Best regards,
mail.team=The VigoTrip Team
mail.autoNotice=This is an automated message from VigoTrip. Please do not reply to this email.
mail.businessDays=3 - 5 business days
# Khuon so tien. {0} la phan chu so DA duoc dinh dang theo locale nguoi nhan
# (xem EmailService.money): tieng Anh nhom bang dau phay, tieng Viet nhom bang dau cham.
mail.currency={0} VND

# ==== Khôi phục mật khẩu ====
mail.reset.subject=Password reset request - VigoTrip
mail.reset.eyebrow=Account security
mail.reset.heading=Reset your password
mail.reset.intro=You asked to reset the password for your {0} account. Use the 6-digit verification code below to continue:
mail.reset.otpWarning=This code is valid for <b>15 minutes</b>. Never share it with anyone.
mail.reset.ignore=If you did not make this request, please ignore this email or contact VigoTrip support to protect your account.

