version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: booking_sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SPRING_DATASOURCE_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - sqlserver_data:/var/opt/mssql

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: booking_sqlserver_init
    depends_on:
      sqlserver:
        condition: service_healthy
    command: >
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "${SPRING_DATASOURCE_PASSWORD}" -C -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'ticket_booking_db') CREATE DATABASE ticket_booking_db"

  backend:
    build:
      context: ./backend/ticket-booking
      dockerfile: Dockerfile
    container_name: booking_backend
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=ticket_booking_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET}
      - VNP_TMN_CODE=${VNP_TMN_CODE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      # Tên miền được phép mở WebSocket giữ ghế. Deploy ở tên miền khác thì thêm vào đây,
      # đừng nới về "*": kênh này từng để mở như vậy, và khi đó bất kỳ trang web nào cũng
      # nhúng được vài dòng JavaScript để đọc luồng chọn ghế của người dùng.
      - WS_ALLOWED_ORIGIN_PATTERNS=${WS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,https://*.duckdns.org,https://*.vercel.app}
      # StartupSecretsValidator BẮT BUỘC hai biến này. Thiếu là container thoát ngay lúc
      # khởi động rồi bị restart lại — trông y hệt "backend tự ngắt" mà không rõ vì sao.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PROVIDER_PASSWORD=${PROVIDER_PASSWORD}
      # Tạm chạy tiếp khi khoá đã lộ nhưng chưa xoay kịp. Bỏ trống = false = chặn khởi động.
      - ALLOW_KNOWN_LEAKED_SECRETS=${ALLOW_KNOWN_LEAKED_SECRETS:-false}
      # Đối chiếu callback với cổng bằng querydr. Để true trừ khi máy không ra được Internet.
      - VNP_VERIFY_CALLBACK=${VNP_VERIFY_CALLBACK:-true}
      - VNP_RETURN_URL=${VNP_RETURN_URL:-http://localhost:8081/api/payment/vnpay-return}
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./my-react-app
      dockerfile: Dockerfile
    container_name: booking_frontend
    ports:
      - "5173:80" # Mapping port 5173 of your host to port 80 of Nginx
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: booking_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: booking_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # SonarQube - Phân tích chất lượng code
  sonarqube:
    image: sonarqube:community
    container_name: booking_sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db

  # PostgreSQL cho SonarQube (SonarQube yêu cầu PostgreSQL)
  sonar-db:
    image: postgres:15-alpine
    container_name: booking_sonar_db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data

volumes:
  grafana_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
  sqlserver_data:
