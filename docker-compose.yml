version: '3.8'

services:
  backend:
    build:
      context: ./backend/ticket-booking
      dockerfile: Dockerfile
    container_name: booking_backend
    ports:
      - "8081:8080"
    environment:
      # host.docker.internal helps Docker connect to your Windows localhost (SQL Server)
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://host.docker.internal:1433;databaseName=ticket_booking_db;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=Toibingu1234
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./my-react-app
      dockerfile: Dockerfile
    container_name: booking_frontend
    ports:
      - "5173:80" # Mapping port 5173 of your host to port 80 of Nginx
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: booking_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: booking_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  grafana_data:

